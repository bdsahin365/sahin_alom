    <!-- Synchronous Theme & Brand Style Hydration (Eliminates Flash of Old Accent / Fonts / Theme) -->
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('msa_theme');
          var isDark = savedTheme ? savedTheme === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
          }

          var raw = localStorage.getItem('msa_site_v13');
          if (raw) {
            var parsed = JSON.parse(raw);
            var b = parsed && parsed.settings && parsed.settings.branding;
            if (b) {
              var color = b.primaryColor || '#C47D0E';
              document.documentElement.style.setProperty('--accent', color);
              var hex = color.replace('#', '');
              if (hex.length === 6) {
                var r = parseInt(hex.substring(0, 2), 16);
                var g = parseInt(hex.substring(2, 4), 16);
                var bVal = parseInt(hex.substring(4, 6), 16);
                if (!isNaN(r) && !isNaN(g) && !isNaN(bVal)) {
                  document.documentElement.style.setProperty('--accent-dim', 'rgba(' + r + ',' + g + ',' + bVal + ',0.1)');
                  document.documentElement.style.setProperty('--accent-glow', 'rgba(' + r + ',' + g + ',' + bVal + ',0.07)');
                }
              }
              if (b.displayFont) {
                document.documentElement.style.setProperty('--font-display', "'" + b.displayFont + "', sans-serif");
              }
              if (b.bodyFont) {
                document.documentElement.style.setProperty('--font-body', "'" + b.bodyFont + "', 'Hind Siliguri', sans-serif");
              }
            }
          }
        } catch (e) {}
      })();
    </script>
